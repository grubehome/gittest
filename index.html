<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>note-cli – Deine Notizen im Terminal</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background: #f4f4f9; color: #333; }
        code { background: #e1e1e8; padding: 3px 6px; border-radius: 4px; font-family: monospace; }
        pre { background: #2d3748; color: #fff; padding: 15px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>📝 note-cli</h1>
    <p>Ein minimalistisches Kommandozeilentool, das Notizen basierend auf ihrem SHA-Hash speichert.</p>
    
    <h2>Features & Commands</h2>
    <pre><code>$ note add "Inhalt der Notiz"  # Speichert unter .notes/db/&lt;hash&gt;
$ note list                  # Listet alle Notizen auf
$ note delete &lt;hash&gt;         # Löscht die Notiz</code></pre>
</body>
</html>
